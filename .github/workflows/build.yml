name: 아이폰 앱 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 앱 아이콘 만들기
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          if [ -f AppIcon.b64 ]; then
            base64 -D -i AppIcon.b64 -o AppIcon.jpg
            sips -s format png -z 1024 1024 AppIcon.jpg --out Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          elif [ -f AppIcon.png ]; then
            sips -s format png -z 1024 1024 AppIcon.png --out Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          else
            python3 make_icon.py
          fi

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 만들기
        run: xcodegen generate

      - name: 앱 빌드
        run: |
          xcodebuild -project SongFinder.xcodeproj \
            -target SongFinder \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -50; tail -n 40 build.log; exit 1; }
          test -d build/Release-iphoneos/SongFinder.app

      - name: 권한(App Group) 넣기
        run: |
          brew install ldid
          APP=build/Release-iphoneos/SongFinder.app
          ldid -SBroadcast.entitlements "$APP/PlugIns/SongFinderBroadcast.appex/SongFinderBroadcast"
          ldid -SSongFinder.entitlements "$APP/SongFinder"
          ldid -e "$APP/SongFinder"

      - name: 설치 파일(.ipa) 만들기
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SongFinder.app Payload/
          zip -qry SongFinder.ipa Payload

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: SongFinder-ipa
          path: SongFinder.ipa

      - name: 다운로드 링크 만들기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 노래찾기 (빌드 ${{ github.run_number }})
          files: SongFinder.ipa
          make_latest: true
