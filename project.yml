name: SongFinder
options:
  bundleIdPrefix: com.heewon
  deploymentTarget:
    iOS: "17.0"
targets:
  SongFinder:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 노래찾기
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: 노래를 듣고 제목과 가수를 찾기 위해 마이크를 사용해요.
        NSSpeechRecognitionUsageDescription: 들린 가사를 받아 적어서 노래를 더 정확하게 찾기 위해 사용해요.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heewon.songfinder
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    scheme: {}
