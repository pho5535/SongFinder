name: SongFinder
options:
  bundleIdPrefix: com.heewon
  deploymentTarget:
    iOS: "17.0"
targets:
  SongFinder:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: SongFinderBroadcast
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Melook
        CFBundleShortVersionString: "2.1"
        CFBundleVersion: "2"
        NSMicrophoneUsageDescription: 노래를 듣고 제목과 가수를 찾기 위해 마이크를 사용해요.
        NSSpeechRecognitionUsageDescription: 들린 가사를 받아 적어서 노래를 더 정확하게 찾기 위해 사용해요.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: SongFinder.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.heewon.songfinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heewon.songfinder
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    scheme: {}
  SongFinderBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Sources/Engines.swift
      - path: Sources/Matcher.swift
      - path: Sources/Shared.swift
      - path: Sources/AudioCapture.swift
    info:
      path: BroadcastInfo.plist
      properties:
        CFBundleDisplayName: Melook
        CFBundleShortVersionString: "2.1"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.heewon.songfinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heewon.songfinder.Broadcast
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
